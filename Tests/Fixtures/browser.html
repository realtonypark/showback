<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showback Browser Fixture</title>
<style>
body { margin: 0; padding: 56px; font: 18px system-ui; color: #17231e; background: #f4f6f1; }
main { max-width: 620px; }
h1 { margin: 0 0 32px; font-size: 34px; }
button, input { font: inherit; border-radius: 7px; padding: 10px 16px; }
button { color: white; background: #246449; border: 0; cursor: pointer; }
input { display: block; margin: 28px 0; border: 1px solid #8a9c90; width: 360px; }
#status { min-height: 32px; margin-bottom: 24px; }
</style>
<main>
<h1>Account</h1>
<p id="status" role="status" aria-live="polite">Signed out</p>
<button id="signin">Sign in</button>
<input aria-label="Demo note" placeholder="Demo note">
<button id="reset">Reset</button>
</main>
<script>
document.querySelector('#signin').onclick = () => { document.querySelector('#status').textContent = 'Welcome, demo user'; };
document.querySelector('#reset').onclick = () => { document.querySelector('#status').textContent = 'Signed out'; document.querySelector('input').value = ''; };
</script>
</html>
